<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartGH-WebPreview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #E6DBD0;
    }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #2E241E;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media (min-width: 481px) {
      #root {
        padding: 20px 16px;
      }
    }

    .app-screen-container {
      width: 100%;
      height: 100%;
      max-width: 100%;
      margin: 0 auto;
      border-radius: 0px;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background-color: #F7F1E8;
    }

    @media (min-width: 481px) {
      .app-screen-container {
        max-width: 440px;
        height: 100%;
        max-height: 94vh;
        border-radius: 16px;
        border: 3px solid #2E241E;
        box-shadow: 6px 6px 0px #2E241E;
      }
    }

    h1,
    h2,
    h3,
    .heading-font {
      font-family: 'Fredoka', 'Nunito', sans-serif;
    }

    @keyframes toastSlideUp {
      from {
        opacity: 0;
        transform: translate(-50%, 12px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
